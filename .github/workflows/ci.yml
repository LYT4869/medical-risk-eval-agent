name: treeSem fast verification
on:
  push:
  pull_request:
jobs:
  fast:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev libssl-dev libcurl4-openssl-dev nlohmann-json3-dev libmysqlcppconn-dev libargon2-dev
      - name: Build pinned Muduo
        run: |
          git clone --depth 1 --branch v2.0.2 https://github.com/chenshuo/muduo.git /tmp/muduo
          cmake -S /tmp/muduo -B /tmp/muduo/build -DMUDUO_BUILD_EXAMPLES=OFF
          cmake --build /tmp/muduo/build -j2
          sudo cmake --install /tmp/muduo/build
      - name: Build remote-only core
        run: cmake -S . -B build -DKAMA_ENABLE_ONNXRUNTIME=OFF -DKAMA_ENABLE_MYSQL=OFF -DKAMA_ENABLE_AUTH=OFF && cmake --build build -j2
      - name: Python dependencies
        run: pip install -r PythonServices/TreeSemAgent/requirements.txt pypdf numpy PyYAML
      - name: Fast tests
        run: ctest --test-dir build --output-on-failure
      - name: Compile optional V2 M2 native SIM MySQL and JWT gateway
        run: |
          cmake -S . -B build-v2-native -DKAMA_ENABLE_ONNXRUNTIME=OFF -DKAMA_ENABLE_MYSQL=ON -DKAMA_ENABLE_AUTH=ON -DKAMA_BUILD_TESTS=OFF
          cmake --build build-v2-native -j2
      - name: Deterministic Agent evaluation
        run: PYTHONPATH=PythonServices/TreeSemAgent python3 PythonServices/TreeSemAgent/evaluation/run_evaluation.py --mode deterministic
      - name: V2 P001 synthetic fixture tests
        run: PYTHONPATH=PythonServices/TreeSemAgent python3 -m unittest discover -s PythonServices/TreeSemAgent/tests -p 'test_p001_fixture.py' -v
      - name: Compose schema validation
        run: docker compose --env-file .env.example config --quiet
      - name: Repository hygiene
        run: git diff --check && test -z "$(git ls-files '*.env' 'artifacts/**' '**/__pycache__/**')"
  v2_m1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated V2 M1 dependencies
        run: python -m pip install -r PythonServices/TreeSemAgent/requirements-v2-m1.txt
      - name: Run V2 M1 checkpoint and idempotency tests
        env:
          PYTHONPATH: PythonServices/TreeSemAgent
          LANGGRAPH_STRICT_MSGPACK: 'true'
        run: python -m unittest discover -s PythonServices/TreeSemAgent/v2_m1/spec_tests -p 'test_*.py' -v

  v2_m2:
    runs-on: ubuntu-24.04
