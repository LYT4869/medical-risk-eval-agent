        with:
          python-version: '3.11'
      - name: Install isolated V2 evaluation dependencies
        run: python -m pip install -r PythonServices/TreeSemAgent/requirements-v2-m1.txt
      - name: M7-B P001 decision and Writer attribution contracts (no real LLM)
        env:
          PYTHONPATH: PythonServices/TreeSemAgent
        run: python -m unittest discover -s PythonServices/TreeSemAgent/v2_m7_eval/spec_tests -p 'test_*.py' -v
